services:
  db:
    # image: postgres:14    # ankane/pgvector:latest # 
    build:
      context: .
      dockerfile: dockerfile.db
    # Use environment variables to configure Postgres
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    # Mount a volume for persistent Postgres data
    volumes:
      - postgres_data:/var/lib/postgresql/data

    # Optional: define a custom name for the container
    container_name: my_django_db
    restart: unless-stopped

  web:
    build: .
    container_name: my_django_web
    command: >
      sh -c "python manage.py migrate &&
             gunicorn personal_RAG.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/code
      - media:/code/media
    restart: unless-stopped
    expose:
      - "8000"
    depends_on:
      - db
    environment:
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - llama_cloud_api=${llama_cloud_api}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ENVIRONMENT_TYPE=${ENVIRONMENT_TYPE}
      - ENFORCE_SSL=${ENFORCE_SSL}
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD}

  nginx:
    image: nginx:alpine
    container_name: my_django_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mount your custom nginx configuration
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Mount your SSL certificates (assumes you have a local ./ssl folder with your cert files)
      - ./ssl:/etc/ssl:ro
    depends_on:
      - web

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - nginx
    networks:
      - default
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    env_file:
      - .env  # Ensure .env contains CLOUDFLARE_TUNNEL_TOKE


volumes:
  postgres_data:
  media:
