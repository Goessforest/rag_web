# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name ai.goessforest.com;
    return 301 https://$host$request_uri;


    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /code/static/;
    }

    location /media/ {
        alias /code/media/;
    }
}

server {
    listen 443 ssl;
    server_name ai.goessforest.com;

    client_max_body_size 100M;  # ✅ Increase max upload size

    ssl_certificate /etc/ssl/goessforest.com_ssl_certificate.cer;
    ssl_certificate_key /etc/ssl/_.goessforest.com_private_key.key;
    ssl_trusted_certificate /etc/ssl/intermediate1.cer;


    # Optional: adjust SSL protocols and ciphers as needed
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
